<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>Ratefolio</title>

    <!-- ホーム画面に追加したときの設定 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- アドレスバーを消して単体アプリのように開く(iOSは apple- 付きのみ対応) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ratefolio" />
    <!-- defaultにしておくと、iOSがステータスバーぶんの余白を確保してくれる。
         black-translucentは内容が時計や電池表示の下に潜り込むうえ、
         明るいテーマのときに文字が読めなくなるため使わない -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- ステータスバーの色。テーマ切り替え時にAppLayoutが書き換える -->
    <meta name="theme-color" content="#2b2e34" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 保存済みのテーマを、画面が描画される前に<html>へ反映する
      // (これをしないと、一瞬だけ既定テーマが見えてから切り替わるちらつきが起きる)
      (function () {
        var THEMES = ['field-notes', 'radar-bright', 'soft-grid', 'quiet-slate']
        try {
          var stored = localStorage.getItem('ratefolio-theme')
          document.documentElement.setAttribute(
            'data-app-theme',
            THEMES.indexOf(stored) === -1 ? 'quiet-slate' : stored,
          )
        } catch (e) {
          document.documentElement.setAttribute('data-app-theme', 'quiet-slate')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
