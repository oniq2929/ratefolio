<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Ratefolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 保存済みのテーマを、画面が描画される前に<html>へ反映する
      // (これをしないと、一瞬だけ既定テーマが見えてから切り替わるちらつきが起きる)
      (function () {
        var THEMES = ['field-notes', 'radar-bright', 'soft-grid']
        try {
          var stored = localStorage.getItem('ratefolio-theme')
          document.documentElement.setAttribute(
            'data-app-theme',
            THEMES.indexOf(stored) === -1 ? 'field-notes' : stored,
          )
        } catch (e) {
          document.documentElement.setAttribute('data-app-theme', 'field-notes')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
