<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">Ratefolio 認証フロー(サインアップ / ログイン)</text>

  <!-- LoginPage -->
  <rect x="40" y="70" width="180" height="60" rx="8" fill="#e8f0fe" stroke="#4c6ef5"/>
  <text x="130" y="95" text-anchor="middle" font-size="13" font-weight="bold">LoginPage</text>
  <text x="130" y="113" text-anchor="middle" font-size="11">メール/パスワード入力</text>

  <!-- Supabase Auth API -->
  <rect x="360" y="70" width="200" height="60" rx="8" fill="#fff3bf" stroke="#f59f00"/>
  <text x="460" y="95" text-anchor="middle" font-size="13" font-weight="bold">Supabase Auth API</text>
  <text x="460" y="113" text-anchor="middle" font-size="11">signUp / signInWithPassword</text>

  <line x1="220" y1="100" x2="358" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- branch: signup path -->
  <rect x="330" y="190" width="260" height="70" rx="8" fill="#ffe3e3" stroke="#e03131"/>
  <text x="460" y="215" text-anchor="middle" font-size="12" font-weight="bold">新規登録(signUp)の場合</text>
  <text x="460" y="233" text-anchor="middle" font-size="11">Confirm emailがONなら</text>
  <text x="460" y="249" text-anchor="middle" font-size="11">確認メール送信・未ログイン状態</text>

  <line x1="460" y1="130" x2="460" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- confirm email off -->
  <rect x="620" y="190" width="240" height="70" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
  <text x="740" y="215" text-anchor="middle" font-size="12" font-weight="bold">Confirm emailがOFFの場合</text>
  <text x="740" y="233" text-anchor="middle" font-size="11">signUp直後にセッション発行</text>
  <text x="740" y="249" text-anchor="middle" font-size="11">(開発時はこちらを使用)</text>

  <line x1="590" y1="220" x2="618" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- login path -->
  <rect x="330" y="300" width="260" height="70" rx="8" fill="#d0ebff" stroke="#1971c2"/>
  <text x="460" y="325" text-anchor="middle" font-size="12" font-weight="bold">ログイン(signInWithPassword)</text>
  <text x="460" y="343" text-anchor="middle" font-size="11">email_confirmed_atが</text>
  <text x="460" y="359" text-anchor="middle" font-size="11">設定済みならセッション発行</text>

  <line x1="460" y1="130" x2="460" y2="298" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- session -->
  <rect x="360" y="410" width="200" height="60" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="460" y="435" text-anchor="middle" font-size="13" font-weight="bold">session / JWT発行</text>
  <text x="460" y="453" text-anchor="middle" font-size="11">auth.uid()の元になる</text>

  <line x1="740" y1="260" x2="460" y2="410" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="370" x2="460" y2="408" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AuthContext -->
  <rect x="640" y="410" width="220" height="60" rx="8" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="750" y="435" text-anchor="middle" font-size="13" font-weight="bold">AuthContext</text>
  <text x="750" y="453" text-anchor="middle" font-size="11">onAuthStateChangeで検知</text>

  <line x1="560" y1="440" x2="638" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HomePage -->
  <rect x="40" y="410" width="220" height="60" rx="8" fill="#e8f0fe" stroke="#4c6ef5"/>
  <text x="150" y="435" text-anchor="middle" font-size="13" font-weight="bold">HomePage</text>
  <text x="150" y="453" text-anchor="middle" font-size="11">useAuth()でuser表示/ログアウト</text>

  <line x1="638" y1="440" x2="262" y2="440" stroke="#333" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

  <text x="450" y="520" text-anchor="middle" font-size="11" fill="#555">破線: 未確認だと signInWithPassword は Invalid login credentials 相当のエラーを返す</text>
  <text x="450" y="540" text-anchor="middle" font-size="11" fill="#555">開発中は「Confirm email」をOFFにするか、SQLで email_confirmed_at を手動設定して確認する</text>
</svg>
