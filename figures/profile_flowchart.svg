<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">プロフィール・共有・ホーム追加案内の流れ</text>
<rect x="30" y="60" width="260" height="80" rx="8" fill="#e8f0fe" stroke="#4c6ef5"/><text x="160" y="88" text-anchor="middle" font-size="13" font-weight="bold">新規登録（LoginPage）</text><text x="160" y="104" text-anchor="middle" font-size="11">signUp成功</text><text x="160" y="120" text-anchor="middle" font-size="11">→ 確認メール送信</text>
<rect x="330" y="60" width="260" height="80" rx="8" fill="#fff3bf" stroke="#f59f00"/><text x="460" y="88" text-anchor="middle" font-size="13" font-weight="bold">iPhoneのブラウザ？</text><text x="460" y="104" text-anchor="middle" font-size="11">isIos() かつ !isStandalone()</text><text x="460" y="120" text-anchor="middle" font-size="11">かつ「表示しない」未選択</text>
<line x1="290" y1="100" x2="328" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="630" y="60" width="240" height="80" rx="8" fill="#d3f9d8" stroke="#2f9e44"/><text x="750" y="88" text-anchor="middle" font-size="13" font-weight="bold">AddToHomeGuide表示</text><text x="750" y="104" text-anchor="middle" font-size="11">共有ボタン→ホーム画面に追加</text><text x="750" y="120" text-anchor="middle" font-size="11">→追加 の3ステップ</text>
<line x1="590" y1="100" x2="628" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/><text x="613" y="96" font-size="10" fill="#555">はい</text>
<rect x="330" y="180" width="260" height="70" rx="8" fill="#e8f0fe" stroke="#4c6ef5"/><text x="460" y="211" text-anchor="middle" font-size="13" font-weight="bold">ログイン後の初回表示</text><text x="460" y="227" text-anchor="middle" font-size="11">AppLayoutでも同じ判定</text>
<line x1="460" y1="180" x2="460" y2="142" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="30" y="300" width="260" height="130" rx="8" fill="#ffe8cc" stroke="#e8590c"/><text x="160" y="337" text-anchor="middle" font-size="13" font-weight="bold">ProfilePage</text><text x="160" y="353" text-anchor="middle" font-size="11">表示名の変更(profiles update)</text><text x="160" y="369" text-anchor="middle" font-size="11">パスワード変更(updateUser)</text><text x="160" y="385" text-anchor="middle" font-size="11">アカウント削除(rpc)</text><text x="160" y="401" text-anchor="middle" font-size="11">ホーム追加方法を再表示</text>
<rect x="330" y="300" width="260" height="130" rx="8" fill="#ffe8cc" stroke="#e8590c"/><text x="460" y="345" text-anchor="middle" font-size="13" font-weight="bold">ShareAppQr</text><text x="460" y="361" text-anchor="middle" font-size="11">window.location.origin</text><text x="460" y="377" text-anchor="middle" font-size="11">→ qrcodeで端末内生成</text><text x="460" y="393" text-anchor="middle" font-size="11">→ 画像(data URL)で表示</text>
<rect x="630" y="300" width="240" height="130" rx="8" fill="#d3f9d8" stroke="#2f9e44"/><text x="750" y="345" text-anchor="middle" font-size="13" font-weight="bold">共有手段</text><text x="750" y="361" text-anchor="middle" font-size="11">QRを相手のカメラで読む</text><text x="750" y="377" text-anchor="middle" font-size="11">navigator.share(共有メニュー)</text><text x="750" y="393" text-anchor="middle" font-size="11">URLをコピー</text>
<line x1="290" y1="365" x2="328" y2="365" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="590" y1="365" x2="628" y2="365" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>