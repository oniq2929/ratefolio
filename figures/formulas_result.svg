<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="sans-serif">
  <rect width="700" height="320" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold">動作確認: カスタム評価式「コスパ重視」</text>

  <rect x="60" y="60" width="580" height="60" rx="8" fill="#ffffff" stroke="#212529"/>
  <text x="80" y="88" font-size="13" font-weight="bold">蕎麦の評価式</text>
  <text x="80" y="106" font-size="12" fill="#495057">コスパ重視 = 3×出汁 + 1×量 - 1×こし</text>

  <rect x="60" y="140" width="580" height="150" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="80" y="165" font-size="13" font-weight="bold">記録一覧 / 公開ランキングでの並び替え結果</text>
  <text x="80" y="190" font-size="12">1位 ○○そば店　計算式スコア: 15</text>
  <text x="80" y="212" font-size="12">2位 △△そば店　計算式スコア: 12</text>
  <text x="80" y="234" font-size="12">3位 □□そば店　計算式スコア: 9</text>
  <text x="80" y="264" font-size="11" fill="#2f9e44">→ 記録一覧・公開一覧のランキング双方で、同じ式による並び替えを確認</text>

  <text x="350" y="310" text-anchor="middle" font-size="11" fill="#555">実際に式を作成し、自分の記録一覧および公開ランキングの両方で並び替えが機能することを確認した</text>
</svg>
