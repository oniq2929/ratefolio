  <text x="450" y="120" text-anchor="middle" font-size="11">mainへのpushで自動ビルド・</text>
  <text x="450" y="136" text-anchor="middle" font-size="11">自動デプロイ</text>

  <line x1="260" y1="110" x2="338" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#arrow9)"/>
  <text x="300" y="100" text-anchor="middle" font-size="10" fill="#555">git push</text>

  <rect x="640" y="70" width="220" height="80" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
