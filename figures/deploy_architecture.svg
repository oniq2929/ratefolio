<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
  <defs>
    <marker id="arrow9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">本番構成(デプロイ後)</text>

  <rect x="40" y="70" width="220" height="80" rx="8" fill="#e8f0fe" stroke="#4c6ef5"/>
  <text x="150" y="100" text-anchor="middle" font-size="13" font-weight="bold">GitHub</text>
  <text x="150" y="120" text-anchor="middle" font-size="11">oniq2929/ratefolio</text>
  <text x="150" y="136" text-anchor="middle" font-size="11">mainブランチ</text>

  <rect x="340" y="70" width="220" height="80" rx="8" fill="#fff3bf" stroke="#f59f00"/>
