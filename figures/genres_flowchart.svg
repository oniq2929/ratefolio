<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">ジャンル作成の処理フロー</text>

  <rect x="40" y="70" width="200" height="60" rx="8" fill="#e8f0fe" stroke="#4c6ef5"/>
  <text x="140" y="95" text-anchor="middle" font-size="13" font-weight="bold">NewGenrePage</text>
  <text x="140" y="113" text-anchor="middle" font-size="11">名前/スケール/軸(3〜8)入力</text>

  <rect x="340" y="70" width="220" height="60" rx="8" fill="#fff3bf" stroke="#f59f00"/>
  <text x="450" y="95" text-anchor="middle" font-size="13" font-weight="bold">genres へ INSERT</text>
  <text x="450" y="113" text-anchor="middle" font-size="11">owner_id = auth.uid()</text>

  <rect x="640" y="70" width="220" height="60" rx="8" fill="#fff3bf" stroke="#f59f00"/>
  <text x="750" y="95" text-anchor="middle" font-size="13" font-weight="bold">axes へ一括 INSERT</text>
  <text x="750" y="113" text-anchor="middle" font-size="11">genre_id / sort_order付き</text>

  <line x1="240" y1="100" x2="338" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="560" y1="100" x2="638" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="640" y="190" width="220" height="80" rx="8" fill="#ffe3e3" stroke="#e03131"/>
  <text x="750" y="215" text-anchor="middle" font-size="12" font-weight="bold">axes INSERT失敗</text>
  <text x="750" y="233" text-anchor="middle" font-size="11">→ 直前に作ったgenresの行を</text>
  <text x="750" y="249" text-anchor="middle" font-size="11">削除し、軸のない孤立</text>
  <text x="750" y="263" text-anchor="middle" font-size="11">ジャンルを残さない</text>

  <line x1="750" y1="130" x2="750" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="340" y="300" width="220" height="60" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
  <text x="450" y="325" text-anchor="middle" font-size="13" font-weight="bold">GenresPage へ遷移</text>
  <text x="450" y="343" text-anchor="middle" font-size="11">select('*, axes(*)')で一覧取得</text>

  <line x1="750" y1="130" x2="450" y2="298" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow3)"/>
  <text x="560" y="220" text-anchor="middle" font-size="11" fill="#555">成功時</text>

  <text x="450" y="400" text-anchor="middle" font-size="11" fill="#555">評価軸は3〜8個に制限(将来のレーダーチャート表示のため。3個未満は多角形にならない)</text>
</svg>
