<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="sans-serif">
  <rect width="700" height="300" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold">動作確認結果: ジャンル作成〜一覧表示</text>

  <rect x="60" y="60" width="580" height="60" rx="8" fill="#ffffff" stroke="#212529"/>
  <text x="80" y="85" font-size="14" font-weight="bold">ジャンル管理</text>
  <rect x="500" y="70" width="120" height="30" rx="6" fill="#212529"/>
  <text x="560" y="90" text-anchor="middle" font-size="11" fill="#ffffff">+ 新しいジャンル</text>

  <rect x="60" y="140" width="580" height="110" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="80" y="168" font-size="15" font-weight="bold">蕎麦</text>
  <text x="600" y="168" text-anchor="end" font-size="11" fill="#e03131">削除</text>
  <text x="80" y="190" font-size="11" fill="#868e96">5段階評価</text>
  <text x="80" y="215" font-size="13">香り / こし / 天ぷら / 出汁 / 量</text>
  <text x="80" y="235" font-size="11" fill="#2f9e44">→ 評価軸5個（3〜8の範囲内）で正常に作成・一覧表示された</text>

  <text x="350" y="280" text-anchor="middle" font-size="11" fill="#555">実際にブラウザから「蕎麦」ジャンル(5段階評価、軸5個)を作成し、一覧に反映されることを確認した</text>
