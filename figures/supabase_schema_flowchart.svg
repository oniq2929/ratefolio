<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- genres -->
  <rect x="40" y="40" width="180" height="70" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="130" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1b4b">genres</text>
  <text x="130" y="90" text-anchor="middle" font-size="11" fill="#3730a3">owner_id / scale_max</text>

  <!-- axes -->
  <rect x="40" y="180" width="180" height="70" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="130" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1b4b">axes</text>
  <text x="130" y="230" text-anchor="middle" font-size="11" fill="#3730a3">genre_id / name</text>

  <!-- entries -->
  <rect x="360" y="110" width="200" height="90" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="460" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#064e3b">entries</text>
  <text x="460" y="160" text-anchor="middle" font-size="11" fill="#065f46">owner_id / is_public</text>
  <text x="460" y="178" text-anchor="middle" font-size="11" fill="#065f46">genre_name / scale_max (snapshot)</text>

  <!-- entry_scores -->
  <rect x="360" y="270" width="200" height="80" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="460" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#064e3b">entry_scores</text>
  <text x="460" y="320" text-anchor="middle" font-size="11" fill="#065f46">axis_name (snapshot) / score</text>

  <!-- storage.objects -->
  <rect x="660" y="110" width="200" height="90" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="760" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">storage.objects</text>
  <text x="760" y="160" text-anchor="middle" font-size="11" fill="#9a3412">entry-photos バケット</text>
  <text x="760" y="178" text-anchor="middle" font-size="11" fill="#9a3412">name = entries.photo_path</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <line x1="220" y1="90" x2="360" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="105" font-size="10" fill="#475569">作成時にスナップショット</text>

  <line x1="220" y1="215" x2="360" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="270" font-size="10" fill="#475569">評価軸ごとに1行</text>

  <line x1="460" y1="200" x2="460" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="560" y1="155" x2="660" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="565" y="145" font-size="10" fill="#475569">photo_path一致</text>

  <!-- legend -->
  <text x="40" y="400" font-size="12" fill="#1e293b" font-weight="bold">凡例</text>
  <rect x="40" y="410" width="16" height="16" fill="#eef2ff" stroke="#4338ca"/>
  <text x="62" y="423" font-size="11" fill="#1e293b">オーナー本人のみ読み書き可(公開ポリシーなし)</text>
  <rect x="40" y="432" width="16" height="16" fill="#ecfdf5" stroke="#047857"/>
  <text x="62" y="445" font-size="11" fill="#1e293b">is_public で読み取り可否が分岐する</text>
</svg>
