<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">プロパティの保存構造（定義とスナップショット）</text>
<rect x="30" y="60" width="380" height="170" rx="8" fill="#e8f0fe" stroke="#4c6ef5"/><text x="220" y="109" text-anchor="middle" font-size="13" font-weight="bold">genre_properties（定義・本人のみ）</text><text x="220" y="125" text-anchor="middle" font-size="11">genre_id: 日本酒ジャンル</text><text x="220" y="141" text-anchor="middle" font-size="11">① 都道府県 / prefecture</text><text x="220" y="157" text-anchor="middle" font-size="11">② 種類 / select [純米, 吟醸, 大吟醸]</text><text x="220" y="173" text-anchor="middle" font-size="11">③ 温度 / number</text><text x="220" y="189" text-anchor="middle" font-size="11">④ 店 / text</text>
<rect x="490" y="60" width="380" height="170" rx="8" fill="#ffe8cc" stroke="#e8590c"/><text x="680" y="109" text-anchor="middle" font-size="13" font-weight="bold">entries.properties（記録ごと）</text><text x="680" y="125" text-anchor="middle" font-size="11">[</text><text x="680" y="141" text-anchor="middle" font-size="11">{name:"都道府県", type:"prefecture", value:"新潟県"},</text><text x="680" y="157" text-anchor="middle" font-size="11">{name:"種類", type:"select", value:"大吟醸"},</text><text x="680" y="173" text-anchor="middle" font-size="11">{name:"温度", type:"number", value:10}</text><text x="680" y="189" text-anchor="middle" font-size="11">]  ※未入力の「店」は保存しない</text>
<line x1="410" y1="145" x2="488" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/><text x="453" y="141" font-size="10" fill="#555">記録時にコピー</text>
<rect x="30" y="280" width="380" height="120" rx="8" fill="#f1f3f5" stroke="#868e96"/><text x="220" y="328" text-anchor="middle" font-size="13" font-weight="bold">定義を後から変更・削除しても</text><text x="220" y="344" text-anchor="middle" font-size="11">過去の記録の値はそのまま残る</text><text x="220" y="360" text-anchor="middle" font-size="11">(評価軸名のスナップショットと同じ方針)</text>
<rect x="490" y="280" width="380" height="120" rx="8" fill="#d3f9d8" stroke="#2f9e44"/><text x="680" y="328" text-anchor="middle" font-size="13" font-weight="bold">entriesのRLSがそのまま効く</text><text x="680" y="344" text-anchor="middle" font-size="11">非公開記録のプロパティは</text><text x="680" y="360" text-anchor="middle" font-size="11">他ユーザーのクエリに混入しない</text>
</svg>