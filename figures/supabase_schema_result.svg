<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="'Segoe UI', sans-serif">
  <rect width="820" height="320" fill="#ffffff"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#1e293b">entries_select_own_or_public の判定フロー</text>

  <rect x="20" y="60" width="160" height="50" rx="6" fill="#f1f5f9" stroke="#334155"/>
  <text x="100" y="90" text-anchor="middle" font-size="12" fill="#1e293b">SELECT * FROM entries</text>

  <rect x="240" y="60" width="200" height="50" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="340" y="85" text-anchor="middle" font-size="12" fill="#713f12">行ごとに判定:</text>
  <text x="340" y="101" text-anchor="middle" font-size="12" fill="#713f12">owner_id = auth.uid() ?</text>

  <rect x="500" y="10" width="160" height="50" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="580" y="40" text-anchor="middle" font-size="12" fill="#14532d">結果に含める(自分の記録)</text>

  <rect x="240" y="150" width="200" height="50" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="340" y="175" text-anchor="middle" font-size="12" fill="#713f12">is_public = true ?</text>

  <rect x="500" y="150" width="160" height="50" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="580" y="180" text-anchor="middle" font-size="12" fill="#14532d">結果に含める(公開記録)</text>

  <rect x="500" y="230" width="160" height="50" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="580" y="260" text-anchor="middle" font-size="12" fill="#7f1d1d">結果から除外(非公開)</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <line x1="180" y1="85" x2="240" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="440" y1="75" x2="500" y2="45" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="450" y="55" font-size="10" fill="#334155">YES</text>
  <line x1="340" y1="110" x2="340" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="345" y="130" font-size="10" fill="#334155">NO</text>
  <line x1="440" y1="165" x2="500" y2="175" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="450" y="160" font-size="10" fill="#334155">YES</text>
  <line x1="440" y1="190" x2="500" y2="245" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="450" y="220" font-size="10" fill="#334155">NO</text>
</svg>
