<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="sans-serif">
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">カスタム評価式(formulas)の作成〜利用フロー</text>

  <rect x="30" y="60" width="260" height="80" rx="8" fill="#e8f0fe" stroke="#4c6ef5"/>
  <text x="160" y="88" text-anchor="middle" font-size="13" font-weight="bold">GenreFormulasPage</text>
  <text x="160" y="106" text-anchor="middle" font-size="11">軸ごとに重みを入力</text>
  <text x="160" y="122" text-anchor="middle" font-size="11">(例: 出汁=3, 量=-1)</text>

  <rect x="340" y="60" width="260" height="80" rx="8" fill="#fff3bf" stroke="#f59f00"/>
  <text x="470" y="88" text-anchor="middle" font-size="13" font-weight="bold">formulasテーブルへ保存</text>
  <text x="470" y="106" text-anchor="middle" font-size="11">weights: {"出汁":3, "量":-1}</text>
  <text x="470" y="122" text-anchor="middle" font-size="11">(軸名をキーにしたJSONB)</text>

  <line x1="290" y1="100" x2="338" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <rect x="30" y="220" width="380" height="100" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
  <text x="220" y="250" text-anchor="middle" font-size="13" font-weight="bold">EntriesPage(自分の記録一覧)</text>
  <text x="220" y="270" text-anchor="middle" font-size="11">同じジャンルの自分の記録に対し、</text>
  <text x="220" y="286" text-anchor="middle" font-size="11">entry_scores.axis_name をキーに</text>
  <text x="220" y="302" text-anchor="middle" font-size="11">重み×スコアを合計して並び替え</text>

  <rect x="480" y="220" width="380" height="100" rx="8" fill="#ffe8cc" stroke="#e8590c"/>
  <text x="670" y="250" text-anchor="middle" font-size="13" font-weight="bold">PublicPage(公開ランキング)</text>
  <text x="670" y="270" text-anchor="middle" font-size="11">他ユーザーの公開記録にも、</text>
  <text x="670" y="286" text-anchor="middle" font-size="11">同じ軸名マッチングで自分の式を</text>
  <text x="670" y="302" text-anchor="middle" font-size="11">当てはめて並び替え</text>

  <line x1="470" y1="140" x2="220" y2="218" stroke="#333" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <line x1="470" y1="140" x2="670" y2="218" stroke="#333" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <text x="450" y="380" text-anchor="middle" font-size="12" font-weight="bold">formulasテーブル自体は本人のみ読み書き可能(RLS)</text>
  <text x="450" y="402" text-anchor="middle" font-size="11" fill="#555">他ユーザーは他人の式を見ることも使うこともできない。「自分の基準」を、</text>
  <text x="450" y="420" text-anchor="middle" font-size="11" fill="#555">自分が閲覧できる記録(自分の記録・他人の公開記録)に当てはめて並び替えるだけ。</text>
</svg>
