<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">記録作成の処理フロー</text>

  <rect x="30" y="70" width="220" height="70" rx="8" fill="#e8f0fe" stroke="#4c6ef5"/>
  <text x="140" y="95" text-anchor="middle" font-size="13" font-weight="bold">NewEntryPage</text>
  <text x="140" y="113" text-anchor="middle" font-size="11">ジャンル選択→軸ごとの</text>
  <text x="140" y="129" text-anchor="middle" font-size="11">スライダーでスコア入力</text>

  <rect x="330" y="70" width="220" height="70" rx="8" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="440" y="95" text-anchor="middle" font-size="13" font-weight="bold">RadarChart(プレビュー)</text>
  <text x="440" y="113" text-anchor="middle" font-size="11">スライダー変更のたびに</text>
  <text x="440" y="129" text-anchor="middle" font-size="11">リアルタイム再描画</text>

  <line x1="250" y1="105" x2="328" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="640" y="70" width="220" height="70" rx="8" fill="#fff3bf" stroke="#f59f00"/>
  <text x="750" y="95" text-anchor="middle" font-size="13" font-weight="bold">entries へ INSERT</text>
  <text x="750" y="113" text-anchor="middle" font-size="11">target_name/日付/タグ/</text>
  <text x="750" y="129" text-anchor="middle" font-size="11">公開設定/ジャンルスナップショット</text>

  <line x1="140" y1="140" x2="750" y2="140" stroke="#333" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="750" y1="140" x2="750" y2="68" stroke="#333" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <text x="450" y="160" text-anchor="middle" font-size="11" fill="#555">「記録する」押下</text>

  <rect x="640" y="190" width="220" height="70" rx="8" fill="#fff3bf" stroke="#f59f00"/>
  <text x="750" y="215" text-anchor="middle" font-size="13" font-weight="bold">entry_scores へ一括INSERT</text>
  <text x="750" y="233" text-anchor="middle" font-size="11">軸ごとのスコア・</text>
  <text x="750" y="249" text-anchor="middle" font-size="11">軸名スナップショット</text>

  <line x1="750" y1="140" x2="750" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="640" y="310" width="220" height="80" rx="8" fill="#ffe3e3" stroke="#e03131"/>
  <text x="750" y="335" text-anchor="middle" font-size="12" font-weight="bold">失敗時</text>
  <text x="750" y="353" text-anchor="middle" font-size="11">直前に作ったentries行を削除</text>
  <text x="750" y="369" text-anchor="middle" font-size="11">(スコアのない記録を残さない)</text>

  <line x1="750" y1="260" x2="750" y2="308" stroke="#333" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="330" y="310" width="220" height="80" rx="8" fill="#d3f9d8" stroke="#2f9e44"/>
  <text x="440" y="335" text-anchor="middle" font-size="12" font-weight="bold">成功時</text>
  <text x="440" y="353" text-anchor="middle" font-size="11">「記録しました」パネルに</text>
  <text x="440" y="369" text-anchor="middle" font-size="11">RadarChartで確認結果を表示</text>

  <line x1="640" y1="225" x2="552" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow4)"/>
</svg>
